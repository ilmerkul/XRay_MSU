repos:
- repo: https://github.com/psf/black-pre-commit-mirror
  rev: 26.3.0
  hooks:
    - id: black
- repo: https://github.com/PyCQA/isort
  rev: 8.0.1
  hooks:
    - id: isort
      name: isort (python)
      args: ["--profile", "black"]
- repo: https://github.com/nbQA-dev/nbQA
  rev: 1.9.1
  hooks:
    - id: nbqa-black
      additional_dependencies: [black==26.3.0]
    - id: nbqa-isort
      additional_dependencies: [isort==8.0.1]
