# PyInstaller: Windows (.exe) и Linux (onedir GUI + CLI) — артефакты Actions.
name: build-binaries

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "cmd/**"
      - "packaging/**"
      - "entry_*.py"
      - "data/**"
      - "config/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - ".github/workflows/build-binaries.yml"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Sync deps + dev (pyinstaller)
        run: uv sync --group dev

      - name: Build exe
        shell: pwsh
        env:
          PYINSTALLER_SPEC_ROOT: ${{ github.workspace }}
        run: |
          uv run --group dev pyinstaller packaging/xray-msu-gui.spec --noconfirm
          uv run --group dev pyinstaller packaging/xray-msu-cli.spec --noconfirm

      - uses: actions/upload-artifact@v4
        with:
          name: xray-msu-windows-exe
          path: dist/*.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: System deps (Tk / Tcl 9 при наличии в репозитории)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          if apt-cache show libtcl9.0t64 &>/dev/null; then
            sudo apt-get install -y libtcl9.0t64 libtcl9tk9.0t64
          elif apt-cache show libtcl9.0 &>/dev/null; then
            sudo apt-get install -y libtcl9.0 libtcl9tk9.0
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Sync deps + dev (pyinstaller)
        run: uv sync --group dev

      - name: Check _tkinter / Tcl (как локальный make dist-gui)
        run: uv run --group dev python packaging/check_linux_tkinter_ldd.py

      - name: Build binaries
        env:
          PYINSTALLER_SPEC_ROOT: ${{ github.workspace }}
          MPLBACKEND: TkAgg
        run: |
          uv run --group dev pyinstaller packaging/xray-msu-gui.spec --noconfirm
          uv run --group dev pyinstaller packaging/xray-msu-cli.spec --noconfirm

      - uses: actions/upload-artifact@v4
        with:
          name: xray-msu-linux-binaries
          path: |
            dist/xray-msu-gui/
            dist/xray-msu-cli
