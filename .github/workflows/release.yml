# Релиз по тегу v*: test → windows + linux → publish.
# иначе артефакты из вызываемого workflow_call часто недоступны для download-artifact.
#
#   git tag -a v0.1.0 -m "0.1.0"
#   git push origin v0.1.0
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Sync deps + dev
        run: uv sync --extra dev

      - name: Lint
        run: uv run --extra dev ruff check src tests/unit

      - name: pytest
        run: uv run --extra dev pytest tests/unit -q

  windows:
    needs: [test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Sync deps + dev (pyinstaller)
        run: uv sync --extra dev

      - name: Build exe
        shell: pwsh
        env:
          PYINSTALLER_SPEC_ROOT: ${{ github.workspace }}
        run: |
          uv run --extra dev pyinstaller packaging/xray-msu-gui.spec --noconfirm
          uv run --extra dev pyinstaller packaging/xray-msu-cli.spec --noconfirm

      - uses: actions/upload-artifact@v4
        with:
          name: xray-msu-windows-exe
          path: dist/*.exe
          retention-days: 1

  linux:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: System deps (Tk / Tcl 9 при наличии в репозитории)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
          if apt-cache show libtcl9.0t64 &>/dev/null; then
            sudo apt-get install -y libtcl9.0t64 libtcl9tk9.0t64
          elif apt-cache show libtcl9.0 &>/dev/null; then
            sudo apt-get install -y libtcl9.0 libtcl9tk9.0
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Sync deps + dev (pyinstaller)
        run: uv sync --extra dev

      - name: Check _tkinter / Tcl
        run: uv run --extra dev python packaging/check_linux_tkinter_ldd.py

      - name: Build binaries
        env:
          PYINSTALLER_SPEC_ROOT: ${{ github.workspace }}
          MPLBACKEND: TkAgg
        run: |
          uv run --extra dev pyinstaller packaging/xray-msu-gui.spec --noconfirm
          uv run --extra dev pyinstaller packaging/xray-msu-cli.spec --noconfirm

      - uses: actions/upload-artifact@v4
        with:
          name: xray-msu-linux-binaries
          path: |
            dist/xray-msu-gui/
            dist/xray-msu-cli
          retention-days: 1

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows exe
        uses: actions/download-artifact@v4
        with:
          name: xray-msu-windows-exe
          path: artifacts/windows

      - name: Download Linux bundle
        uses: actions/download-artifact@v4
        with:
          name: xray-msu-linux-binaries
          path: artifacts/linux

      - name: Архив Linux
        run: |
          set -eux
          test -d artifacts/linux
          tar -czvf xray-msu-linux-amd64.tar.gz -C artifacts/linux .

      - name: Собрать вложения
        run: |
          set -eux
          mkdir -p release-files
          find artifacts/windows -type f -name "*.exe" -exec cp -t release-files/ {} +
          cp -v xray-msu-linux-amd64.tar.gz release-files/
          test -f release-files/xray-msu-gui.exe
          test -f release-files/xray-msu-cli.exe
          ls -la release-files/

      - name: GitHub Release + вложения
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-files/xray-msu-gui.exe
            release-files/xray-msu-cli.exe
            release-files/xray-msu-linux-amd64.tar.gz
