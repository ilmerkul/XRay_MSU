# Релиз по тегу v*: собирает бинарники (reuse build-binaries) и прикрепляет к GitHub Release.
#
# Локально:
#   git tag -a v0.1.0 -m "0.1.0"
#   git push origin v0.1.0
#
# Вручную без CI: Releases → Draft release → выбрать тег → прикрепить файлы из Actions → build-binaries.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-binaries.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows exe
        uses: actions/download-artifact@v4
        with:
          name: xray-msu-windows-exe
          path: artifacts/windows

      - name: Download Linux bundle
        uses: actions/download-artifact@v4
        with:
          name: xray-msu-linux-binaries
          path: artifacts/linux

      - name: Архив Linux (dist/ из артефакта)
        run: |
          set -eux
          test -d artifacts/linux/dist
          tar -czvf xray-msu-linux-amd64.tar.gz -C artifacts/linux dist

      - name: Собрать вложения (exe могут лежать в подкаталогах артефакта)
        run: |
          set -eux
          mkdir -p release-files
          find artifacts/windows -type f -name "*.exe" -exec cp -t release-files/ {} +
          cp -v xray-msu-linux-amd64.tar.gz release-files/
          ls -la release-files/

      - name: GitHub Release + вложения
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-files/*
