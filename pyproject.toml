[project]
name = "xray-msu"
version = "0.1.5"
description = "Powder XRD simulation: crystal structure → intensities, CLI and Tk GUI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "omegaconf>=2.3.0",
    "scipy>=1.17.1",
    "spglib>=2.7.0",
]

[project.optional-dependencies]
xraylib = ["xraylib>=4.2.1"]
dev = [
    "isort>=8.0.1",
    "pre-commit>=4.6.0",
    "pyinstaller>=6.19.0",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]
cli = [
    "questionary>=2.1.1",
]
gui = [
    "customtkinter>=5.2.2",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]

# Предпочитать /usr/bin/python* (дистрибутивный tkinter → libtcl8.6 + python3-tk). Автономные сборки uv
# часто слинкованы с Tcl 9; на LTS без пакетов libtcl9* ldd даёт «not found» и PyInstaller GUI не собрать.
[tool.uv]
python-preference = "system"
