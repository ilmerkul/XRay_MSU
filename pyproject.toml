[project]
name = "xray-msu"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "customtkinter>=5.2.2",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "omegaconf>=2.3.0",
    "pre-commit>=4.5.1",
    "ruff>=0.15.9",
    "scipy>=1.17.1",
    "spglib>=2.7.0",
    "xraylib>=4.2.1",
]

[dependency-groups]
dev = ["pyinstaller>=6.6.0"]

# Предпочитать /usr/bin/python* (дистрибутивный tkinter → libtcl8.6 + python3-tk). Автономные сборки uv
# часто слинкованы с Tcl 9; на LTS без пакетов libtcl9* ldd даёт «not found» и PyInstaller GUI не собрать.
[tool.uv]
python-preference = "system"
